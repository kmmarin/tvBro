# Submits the resolved Gradle dependency graph so GitHub (Dependabot) alerts on vulnerable libraries.
name: Dependency graph

on:
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@v4