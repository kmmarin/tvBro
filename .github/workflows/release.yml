# SPDX-License-Identifier: Apache-2.0
# Builds and publishes a GitHub Release for a version tag vX.Y.Z that is on main:
#   tvbro-X.Y.Z.apk + tvbro.apk (signed universal APK, same file), tvbro-windows-x64.zip,
#   tvbro-linux-arm64.tar.gz, SHA256SUMS.txt.
# Nothing is built or published unless the whole CI workflow (tests and security scans) passes for the tag.
# Signing uses repository secrets: TVBRO_KEYSTORE_BASE64, TVBRO_KEYSTORE_PASSWORD, TVBRO_KEY_ALIAS, TVBRO_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || { echo "tag $tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $tag is not on main"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check_private.py

  ci:
    name: CI (tests, personal-data scan, gitleaks, dependency scan)
    needs: check
    uses: ./.github/workflows/ci.yml

  android:
    name: Signed APK
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore from secrets
        env:
          KS: ${{ secrets.TVBRO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "TVBRO_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/tvbro-release.jks"
      - name: Test and build
        env:
          TVBRO_KEYSTORE: ${{ runner.temp }}/tvbro-release.jks
          TVBRO_KEYSTORE_PASSWORD: ${{ secrets.TVBRO_KEYSTORE_PASSWORD }}
          TVBRO_KEY_ALIAS: ${{ secrets.TVBRO_KEY_ALIAS }}
          TVBRO_KEY_PASSWORD: ${{ secrets.TVBRO_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon :shared:test :app:testReleaseUnitTest :app:assembleRelease
          -Ptvbro.version=${{ needs.check.outputs.version }}
          -Ptvbro.updateRepo=${{ github.repository }}
      - name: Verify signature and collect
        run: |
          v=${{ needs.check.outputs.version }}
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$apk"
          mkdir -p dist && cp "$apk" "dist/tvbro-$v.apk" && cp "$apk" dist/tvbro.apk
          rm -f "$RUNNER_TEMP/tvbro-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    name: Windows zip
    needs: [check, ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :desktop:createDistributable
        shell: bash
      - name: Zip (without libmpv, see docs/THIRD_PARTY.md)
        shell: pwsh
        run: |
          $app = "desktop/build/compose/binaries/main/app/tvBro"
          Copy-Item LICENSE, NOTICE $app
          @"
          tvBro for Windows plays video with libmpv, which is not included (different license).
          Download mpv-dev-x86_64-<date>.7z from https://github.com/shinchiro/mpv-winbuild-cmake/releases,
          open it with 7-Zip and copy libmpv-2.dll into this folder, next to tvBro.exe.
          Full guide: https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md
          "@ | Set-Content -Encoding utf8 "$app/README-libmpv.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath dist/tvbro-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  pi:
    name: Raspberry Pi / Linux arm64 tarball
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :desktop:piLibs -Ptarget=linux-arm64
      - name: Temurin 17 JRE for aarch64 and pack
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jre.tar.gz" \
            "https://api.adoptium.net/v3/binary/latest/17/ga/linux/aarch64/jre/hotspot/normal/eclipse"
          mkdir -p dist
          python3 desktop/packaging/pack_pi.py desktop/build/pi/lib "$RUNNER_TEMP/jre.tar.gz" NOTICE LICENSE dist/tvbro-linux-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pi
          path: dist/

  publish:
    name: GitHub Release
    needs: [check, ci, android, windows, pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          v=${{ needs.check.outputs.version }}
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          IFS=. read -r ma mi pa <<< "$v"
          code=$((ma * 10000 + mi * 100 + pa))
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          { [ -f "$notes" ] && cat "$notes" || echo "tvBro $v"; echo; echo "Install: https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md"; } > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "tvBro ${{ needs.check.outputs.version }}" --notes-file notes.md --verify-tag
