# Cross-build linkers for the build machine (Windows x64 host; toolchain paths in C:\tools\native\README.md).
# Opt-in per command (kept out of .cargo/config.toml so plain host builds never pick up machine paths):
#
#   cargo build --config cross.toml -p tvbro-ffi --release --target aarch64-linux-android      # arm64-v8a
#   cargo build --config cross.toml -p tvbro-ffi --release --target armv7-linux-androideabi    # armeabi-v7a
#   cargo build --config cross.toml -p tvbro-ffi --release --target x86_64-linux-android       # x86_64 (emulator)
#   cargo build --config cross.toml -p tvbro-ffi --release --target aarch64-unknown-linux-gnu  # linux-aarch64
#
# Android: NDK 27.3.13750724, API 24 (the app's minSdk) clang wrappers as linker and as C compiler for the bundled
# SQLite (rusqlite / cc). 64-bit ABIs are linked with 16 KB page alignment (required from Android 15 on).

[target.aarch64-linux-android]
linker = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
linker = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi24-clang.cmd"

[target.x86_64-linux-android]
linker = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android24-clang.cmd"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# linux-aarch64: LLVM clang + lld from PATH (e.g. scoop llvm) against the Debian 12 arm64 sysroot (glibc 2.36, gcc 12 crt files).
[target.aarch64-unknown-linux-gnu]
linker = "clang.exe"
rustflags = [
    "-C", "link-arg=--target=aarch64-linux-gnu",
    "-C", "link-arg=--sysroot=C:/tools/native/pi-sysroot",
    "-C", "link-arg=--gcc-install-dir=C:/tools/native/pi-sysroot/usr/lib/gcc/aarch64-linux-gnu/12",
    "-C", "link-arg=-fuse-ld=lld",
]

[env]
CC_aarch64_linux_android = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
AR_aarch64_linux_android = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_armv7_linux_androideabi = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi24-clang.cmd"
AR_armv7_linux_androideabi = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_x86_64_linux_android = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android24-clang.cmd"
AR_x86_64_linux_android = "C:/tools/native/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_aarch64_unknown_linux_gnu = "clang.exe"
AR_aarch64_unknown_linux_gnu = "llvm-ar.exe"
CFLAGS_aarch64_unknown_linux_gnu = "--target=aarch64-linux-gnu --sysroot=C:/tools/native/pi-sysroot"
