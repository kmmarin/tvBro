[package]
name = "tvbro-core"
description = "tvBro shared core: playlist / guide parsing, channel logic, search, security primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tvbro_core"

[dependencies]
aes-gcm = "0.11.1"
crc32fast = "1.5"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = { version = "2", features = ["serde"] }
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
quick-xml = { version = "0.42.0", features = ["encoding"] }
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
url = "2.5.8"

[dev-dependencies]
proptest = "1.12.0"
