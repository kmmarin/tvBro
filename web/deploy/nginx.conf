# nginx site for tvBro (LAN only). Serves the static frontend and reverse-proxies the backend.
# nginx 1.22 syntax: "listen ... ssl http2", not "http2 on".
# tvbro.example.lan is replaced by TVBRO_SERVER_NAME from /etc/default/tvbro when the
# deploy scripts install this file (setup_lxc.sh / update_lxc.sh).

# access log without query strings (signed media URLs, image addresses, search words)
log_format tvbro_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name tvbro.example.lan;
    access_log /var/log/nginx/access.log tvbro_noquery;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tvbro.example.lan;
    access_log /var/log/nginx/access.log tvbro_noquery;

    ssl_certificate     /etc/nginx/certs/tvbro/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tvbro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/tvbro/frontend;
    index index.html;

    # security headers (repeated in every location that sets its own add_header: nginx does not
    # inherit add_header into such locations)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # static frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    # the page is tiny and names versioned (?v=) CSS/JS: always revalidate it
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    }
    location ~ \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # backend API + media relay (it sends the same headers; nginx's own copies are used)
    location ~ ^/(api|stream|seg|vodstream|img|remux|rec)(/|$|\?) {
        proxy_pass http://127.0.0.1:8750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        # streaming: no buffering, long read timeouts, support Range
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    client_max_body_size 4m;
}
